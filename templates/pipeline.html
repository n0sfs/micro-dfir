{% extends "base.html" %}{% block content %}
<h2><i class="fa-solid fa-filter text-primary"></i> Log Pipeline Management</h2>
<div class="card bg-dark border-secondary mb-4 shadow-sm"><div class="card-body"><form id="arf" class="row g-3 align-items-end"><div class="col-md-2"><label class="text-muted small">Field</label><select id="rf" class="form-select bg-dark text-light"><option value="app_name">App Name</option><option value="hostname">Hostname</option><option value="severity">Severity</option><option value="message">Raw Message</option></select></div><div class="col-md-2"><label class="text-muted small">Operator</label><select id="ro" class="form-select bg-dark text-light"><option value="equals">Equals</option><option value="contains">Contains</option></select></div><div class="col-md-3"><label class="text-muted small">Value</label><input type="text" id="rv" class="form-control bg-dark text-light" required></div><div class="col-md-3"><label class="text-muted small">Description</label><input type="text" id="rd" class="form-control bg-dark text-light" required></div><div class="col-md-2"><button type="submit" class="btn btn-primary w-100" id="srb">Apply Drop Rule</button></div></form></div></div>
<div class="card bg-dark border-secondary shadow-sm"><div class="card-body p-0"><table class="table table-dark mb-0"><thead><tr><th>ID</th><th>Condition</th><th>Description</th><th class="text-center">Status</th><th></th></tr></thead><tbody id="rtb"></tbody></table></div></div>
{% endblock %}{% block scripts %}<script>async function lr(){const r=await(await fetch('/api/droprules')).json(); document.getElementById('rtb').innerHTML=r.map(rl=>`<tr><td>#${rl.id}</td><td>${rl.field} ${rl.operator} "${rl.value}"</td><td>${rl.description}</td><td class="text-center"><input class="form-check-input" type="checkbox" ${rl.enabled?'checked':''} onchange="fetch('/api/droprules/${rl.id}/toggle',{method:'PUT'}).then(lr)"></td><td><button class="btn btn-sm btn-outline-danger" onclick="fetch('/api/droprules/${rl.id}',{method:'DELETE'}).then(lr)"><i class="fa-solid fa-trash"></i></button></td></tr>`).join('');} document.getElementById('arf').addEventListener('submit',async(e)=>{e.preventDefault(); await fetch('/api/droprules',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({field:document.getElementById('rf').value,operator:document.getElementById('ro').value,value:document.getElementById('rv').value,description:document.getElementById('rd').value})}); document.getElementById('arf').reset(); lr();}); lr();</script>{% endblock %}
