<!DOCTYPE html><html lang="en" data-bs-theme="dark"><head><title>Login</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"><style>body{background-color:#121212;display:flex;align-items:center;justify-content:center;height:100vh;}</style></head><body><div class="card bg-dark border-secondary shadow-lg" style="width: 400px;"><div class="card-header text-center border-secondary py-4"><h3 class="text-primary">Micro DFIR</h3></div><div class="card-body p-4">{% with messages = get_flashed_messages(with_categories=true) %}{% if messages %}{% for category, message in messages %}<div class="alert alert-{{ category }}">{{ message }}</div>{% endfor %}{% endif %}{% endwith %}<form method="POST"><div class="mb-3"><label>Username</label><input type="text" name="username" class="form-control bg-dark text-light border-secondary" required autofocus></div><div class="mb-4"><label>Password</label><input type="password" name="password" class="form-control bg-dark text-light border-secondary" required></div><button type="submit" class="btn btn-primary w-100">Login</button></form></div></div></body></html>
