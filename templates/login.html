<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
{% include '_head_theme.html' %}
<title>Login</title>
<style>
body{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:16px;}
.login-card{width:400px;max-width:100%;}
.login-card h3 i{color:var(--accent);margin-right:8px;}
</style>
</head>
<body>
<div class="card bg-dark border-secondary shadow-lg login-card">
  <div class="card-header text-center border-secondary py-4">
    <h3 class="text-primary"><i class="fa-solid fa-shield-halved"></i>Micro DFIR</h3>
  </div>
  <div class="card-body p-4">
    {% with messages = get_flashed_messages(with_categories=true) %}{% if messages %}{% for category, message in messages %}<div class="alert alert-{{ category }}">{{ message }}</div>{% endfor %}{% endif %}{% endwith %}
    <form method="POST">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="mb-3">
        <label for="loginUsername" class="form-label">Username</label>
        <input type="text" id="loginUsername" name="username" class="form-control bg-dark text-light border-secondary" required autofocus>
      </div>
      <div class="mb-4">
        <label for="loginPassword" class="form-label">Password</label>
        <input type="password" id="loginPassword" name="password" class="form-control bg-dark text-light border-secondary" required>
      </div>
      <button type="submit" class="btn btn-primary w-100">Login</button>
    </form>
  </div>
</div>
</body>
</html>
