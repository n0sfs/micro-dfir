{% extends "base.html" %}{% block content %}
<h2>SOC Dashboard</h2><div class="grid-stack"><div class="grid-stack-item" gs-w="8" gs-h="6"><div class="grid-stack-item-content p-3 border rounded border-secondary" style="background:#1e2125; overflow-y:auto;"><h5 class="border-bottom border-secondary pb-2"><i class="fa-solid fa-list"></i> Live Event Stream</h5><table class="table table-dark table-sm"><thead><tr><th>Time</th><th>Host</th><th>App</th><th>Message</th></tr></thead><tbody id="logs-body"></tbody></table></div></div><div class="grid-stack-item" gs-x="8" gs-w="4" gs-h="6"><div class="grid-stack-item-content p-3 border rounded border-secondary text-center" style="background:#1e2125;"><h5 class="border-bottom border-secondary pb-2 text-info"><i class="fa-solid fa-file-code"></i> YARA Scanner</h5><form id="yara-form" class="mt-4"><input class="form-control bg-dark text-light mb-3" type="file" id="yf" required><button type="submit" class="btn btn-outline-info w-100" id="sbtn">Run Scan</button></form><div id="yr" class="mt-3 text-start"></div></div></div></div>
{% endblock %}{% block scripts %}<script>GridStack.init({cellHeight:80,margin:10}); async function fetchLogs(){const res=await fetch('/api/events?limit=30');const logs=await res.json(); document.getElementById('logs-body').innerHTML=logs.map(l=>`<tr><td>${l.timestamp}</td><td>${l.hostname}</td><td>${l.app_name}</td><td>${l.message.substring(0,100)}</td></tr>`).join('');} setInterval(fetchLogs, 3000); fetchLogs(); document.getElementById('yara-form').addEventListener('submit', async(e)=>{e.preventDefault(); const fd=new FormData(); fd.append('file',document.getElementById('yf').files[0]); document.getElementById('yr').innerHTML='Scanning...'; try{const res=await fetch('/api/yara/scan',{method:'POST',body:fd});const d=await res.json(); document.getElementById('yr').innerHTML=d.error?d.error:(d.matches&&d.matches.length>0?`Threats: ${d.matches.map(m=>m.rule_name).join(', ')}`:`Clean.`);}catch(e){document.getElementById('yr').innerHTML='Failed';}});</script>{% endblock %}
