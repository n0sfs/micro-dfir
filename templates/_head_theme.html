<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg-page:#0a0d12;
  --bg-sidebar:#0d1117;
  --bg-card:#12161d;
  --bg-card-alt:#161b23;
  --bg-inset:#0a0d12;
  --border:#232a35;
  --border-light:#2c3543;
  --text-primary:#e8eaed;
  --text-secondary:#96a0b0;
  --text-muted:#5e6b7d;
  --accent:#3b82f6;
  --accent-dim:rgba(59,130,246,.12);
  --accent-hover:#5b93f7;
  --success:#22c55e;
  --warning:#f59e0b;
  --danger:#ef4444;
  --info:#38bdf8;
  --radius:8px;
  --shadow-card:0 1px 2px rgba(0,0,0,.4), 0 1px 0 rgba(255,255,255,.02) inset;
  --font-sans:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --font-mono:'JetBrains Mono',ui-monospace,'SFMono-Regular',Consolas,monospace;
}

/* Light mode: redefines the same custom properties dark mode uses -- every rule below
   (.bg-dark, .border-secondary, .table-dark, .form-control, etc.) already resolves
   through these variables rather than Bootstrap's fixed dark colors, so flipping
   data-bs-theme (the same attribute Bootstrap's own components already key off) is
   enough to re-theme the whole app without touching individual templates. */
html[data-bs-theme="light"]{
  --bg-page:#f4f5f7;
  --bg-sidebar:#ffffff;
  --bg-card:#ffffff;
  --bg-card-alt:#eef0f3;
  --bg-inset:#eef0f3;
  --border:#dde1e7;
  --border-light:#c7cdd6;
  --text-primary:#1a1d23;
  --text-secondary:#4b5568;
  --text-muted:#8891a0;
  --accent:#2563eb;
  --accent-dim:rgba(37,99,235,.08);
  --accent-hover:#1d4ed8;
  --success:#16a34a;
  --warning:#d97706;
  --danger:#dc2626;
  --info:#0284c7;
  --shadow-card:0 1px 2px rgba(20,22,28,.06), 0 1px 0 rgba(20,22,28,.03);
}

* { scrollbar-color: var(--border-light) transparent; }
::-webkit-scrollbar{width:10px;height:10px;}
::-webkit-scrollbar-thumb{background:var(--border-light);border-radius:5px;}
::-webkit-scrollbar-track{background:transparent;}

body{
  background-color:var(--bg-page);
  color:var(--text-primary);
  font-family:var(--font-sans);
  font-size:.925rem;
}
h1,h2,h3,h4,h5,h6{font-weight:600;letter-spacing:-.01em;}
code, .font-monospace{font-family:var(--font-mono)!important;}
a{color:var(--accent);}
hr{border-color:var(--border);}
</style>
