{% extends "base.html" %}
{% block content %}
<div class="container-fluid mt-4">
    <h2 class="text-primary"><i class="fa-solid fa-file-shield"></i> Sigma Rules Engine</h2>
    <hr class="border-secondary">

    <div class="card shadow-sm border-secondary bg-dark text-light mb-4">
        <div class="card-body">
            
            <!-- Filters -->
            <div class="row mb-3">
                <div class="col-md-3 mb-2">
                    <input type="text" id="rq" class="form-control bg-dark text-light border-secondary" placeholder="Search titles..." onkeyup="f()">
                </div>
                <div class="col-md-2 mb-2">
                    <select id="typeFilter" class="form-select bg-dark text-light border-secondary" onchange="f()">
                        <option value="">All Types</option>
                    </select>
                </div>
                <div class="col-md-2 mb-2">
                    <select id="platformFilter" class="form-select bg-dark text-light border-secondary" onchange="f()">
                        <option value="">All Platforms</option>
                    </select>
                </div>
                <div class="col-md-2 mb-2">
                    <select id="catFilter" class="form-select bg-dark text-light border-secondary" onchange="f()">
                        <option value="">All Subcategories</option>
                    </select>
                </div>
                <div class="col-md-3 mb-2">
                    <select id="mitreFilter" class="form-select bg-dark text-light border-secondary" onchange="f()">
                        <option value="">All MITRE Tags</option>
                    </select>
                </div>
            </div>

            <!-- Bulk Actions Toolbar -->
            <div class="d-flex gap-2 mb-3 align-items-center bg-secondary bg-opacity-10 p-2 rounded border border-secondary">
                <button class="btn btn-sm btn-outline-secondary" onclick="toggleAll(true)">Select All Visible</button>
                <button class="btn btn-sm btn-outline-secondary" onclick="toggleAll(false)">Clear Selection</button>
                <div class="ms-auto">
                    <button class="btn btn-sm btn-outline-success" onclick="bulkAction(true)"><i class="fa-solid fa-play"></i> Enable Selected</button>
                    <button class="btn btn-sm btn-outline-danger" onclick="bulkAction(false)"><i class="fa-solid fa-stop"></i> Disable Selected</button>
                </div>
            </div>

            <!-- Interactive Table -->
            <div class="table-responsive" style="max-height: 600px; overflow-y: auto;">
                <table class="table table-dark table-hover table-sm align-middle">
                    <thead>
                        <tr>
                            <th style="width: 40px;"></th>
                            <th style="width: 80px;">Status</th>
                            <th>Rule Title</th>
                            <th>Platform</th>
                            <th>Subcategory</th>
                            <th>MITRE ATT&CK</th>
                        </tr>
                    </thead>
                    <tbody id="rt"></tbody>
                </table>
            </div>

        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
let allRules = [];
let selectedIds = new Set();

async function ld(){
    allRules = await(await fetch('/api/rules')).json(); 
    
    // Parse out unique filters
    const types = new Set();
    const platforms = new Set();
    const cats = new Set();
    const mitres = new Set();
    
    allRules.forEach(r => {
        if(r.rule_type) types.add(r.rule_type);
        if(r.platform) platforms.add(r.platform);
        if(r.category) cats.add(r.category);
        if(r.tags) r.tags.forEach(t => mitres.add(t));
    });
    
    const typeSelect = document.getElementById('typeFilter');
    const platSelect = document.getElementById('platformFilter');
    const catSelect = document.getElementById('catFilter');
    const mitreSelect = document.getElementById('mitreFilter');
    
    typeSelect.innerHTML = '<option value="">All Types</option>';
    platSelect.innerHTML = '<option value="">All Platforms</option>';
    catSelect.innerHTML = '<option value="">All Subcategories</option>';
    mitreSelect.innerHTML = '<option value="">All MITRE Tags</option>';
    
    Array.from(types).sort().forEach(t => typeSelect.innerHTML += `<option value="${t}">${t}</option>`);
    Array.from(platforms).sort().forEach(p => platSelect.innerHTML += `<option value="${p}">${p}</option>`);
    Array.from(cats).sort().forEach(c => catSelect.innerHTML += `<option value="${c}">${c}</option>`);
    Array.from(mitres).sort().forEach(m => mitreSelect.innerHTML += `<option value="${m}">${m}</option>`);

    renderTable(allRules);
} 

function renderTable(rules) {
    document.getElementById('rt').innerHTML = rules.map(rl => `
        <tr>
            <td><input type="checkbox" class="form-check-input rule-cb bg-dark border-secondary" value="${rl.id}" onchange="updateSelection(this)"></td>
            <td>
                <div class="form-check form-switch">
                    <input class="form-check-input" type="checkbox" ${rl.enabled ? 'checked' : ''} onchange="toggleSingle(${rl.id}, this.checked)">
                </div>
            </td>
            <td>
                <span class="badge ${rl.rule_type === 'Generic' ? 'bg-secondary' : (rl.rule_type === 'Compliance' ? 'bg-primary' : 'bg-danger')} me-2">${rl.rule_type}</span>
                <span class="fw-bold text-info">${rl.title}</span>
            </td>
            <td><span class="text-light"><i class="fa-solid fa-display me-1"></i>${rl.platform}</span></td>
            <td><span class="badge bg-secondary">${rl.category}</span></td>
            <td>${(rl.tags || []).map(t => `<span class="badge bg-primary bg-opacity-25 text-light border border-primary me-1 mb-1">${t}</span>`).join('')}</td>
        </tr>
    `).join('');
    selectedIds.clear(); 
}

function f(){
    const q = document.getElementById('rq').value.toLowerCase();
    const type = document.getElementById('typeFilter').value;
    const plat = document.getElementById('platformFilter').value;
    const cat = document.getElementById('catFilter').value;
    const mitre = document.getElementById('mitreFilter').value;
    
    const filtered = allRules.filter(rl => {
        const matchQ = rl.title.toLowerCase().includes(q);
        const matchType = type === "" || rl.rule_type === type;
        const matchPlat = plat === "" || rl.platform === plat;
        const matchCat = cat === "" || rl.category === cat;
        const matchMitre = mitre === "" || (rl.tags && rl.tags.includes(mitre));
        return matchQ && matchType && matchPlat && matchCat && matchMitre;
    });
    
    renderTable(filtered);
}

function toggleAll(state) {
    document.querySelectorAll('.rule-cb').forEach(cb => {
        cb.checked = state;
        updateSelection(cb);
    });
}

function updateSelection(cb) {
    if (cb.checked) selectedIds.add(cb.value);
    else selectedIds.delete(cb.value);
}

async function toggleSingle(id, state) {
    await fetch(`/api/rules/${id}/toggle`, {method: 'PUT'});
}

async function bulkAction(enable) {
    const ids = Array.from(selectedIds).map(id => parseInt(id));
    if (ids.length === 0) return alert("Please select at least one rule.");
    
    await fetch('/api/rules/bulk_update', {
        method: 'PUT',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ids: ids, enable: enable})
    });
    
    ld(); 
}

ld();
</script>
{% endblock %}
