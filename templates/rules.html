{% extends "base.html" %}{% block content %}
<h2>Sigma Rules Engine</h2><input type="text" id="rq" class="form-control bg-dark text-light mb-3" placeholder="Filter rules..." onkeyup="f()"><div style="max-height: 600px; overflow-y: auto;"><table class="table table-dark table-sm"><tbody id="rt"></tbody></table></div>
{% endblock %}{% block scripts %}<script>async function ld(){const r=await(await fetch('/api/rules')).json(); document.getElementById('rt').innerHTML=r.map(rl=>`<tr><td>${rl.title}</td><td><input type="checkbox" ${rl.enabled?'checked':''} onchange="fetch('/api/rules/${rl.id}/toggle',{method:'PUT'})"></td></tr>`).join('');} function f(){const q=document.getElementById('rq').value.toLowerCase();Array.from(document.getElementById('rt').getElementsByTagName('tr')).forEach(tr=>tr.style.display=tr.innerText.toLowerCase().includes(q)?'':'none');} ld();</script>{% endblock %}
