{% extends "base.html" %}
{% block content %}
<div class="page-header">
    <h2><i class="fa-solid fa-house me-2"></i>Home</h2>
    <p>An overview of what's happening across your environment.</p>
</div>

<div class="row g-3 mb-4">
    <div class="col-6 col-lg"><div class="stat-tile"><div class="stat-label" id="homeStatLabel0">—</div><div class="stat-value" id="homeStatValue0">—</div></div></div>
    <div class="col-6 col-lg"><div class="stat-tile"><div class="stat-label" id="homeStatLabel1">—</div><div class="stat-value" id="homeStatValue1">—</div></div></div>
    <div class="col-6 col-lg"><div class="stat-tile"><div class="stat-label" id="homeStatLabel2">—</div><div class="stat-value" id="homeStatValue2">—</div></div></div>
    <div class="col-6 col-lg"><div class="stat-tile"><div class="stat-label" id="homeStatLabel3">—</div><div class="stat-value" id="homeStatValue3">—</div></div></div>
    <div class="col-6 col-lg"><div class="stat-tile"><div class="stat-label" id="homeStatLabel4">—</div><div class="stat-value" id="homeStatValue4">—</div></div></div>
</div>

<div id="homeWidgetsContainer" class="row g-3"></div>
<p class="text-muted small mt-3 mb-0" id="homeHiddenWidgetsRow" style="display:none;"></p>
{% endblock %}

{% block scripts %}
<script>
function escHtml(s) {
    return (s === null || s === undefined) ? '' : String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function setHomeStat(i, label, value) {
    document.getElementById('homeStatLabel' + i).innerText = label;
    document.getElementById('homeStatValue' + i).innerText = value;
}

function loadHomeStats() {
    fetch('/api/home/stats').then(r => r.json()).then(d => {
        setHomeStat(0, 'Hosts Tracked', d.hosts_tracked);
        setHomeStat(1, 'Users Tracked', d.users_tracked);
        setHomeStat(2, 'Events Today', d.events_today);
        setHomeStat(3, 'Unacknowledged Alerts', d.alerts_unacknowledged);
        setHomeStat(4, 'Anomalies Today', d.anomalies_today);
    }).catch(err => console.error('Error loading home stats:', err));
}

// ---- Widgets: registry + show/hide/reorder, persisted to localStorage ----
// Matches this app's existing UI-customization precedent (sidebar-collapsed state,
// SIEM active-tab, rules table column widths) -- no per-user DB storage exists
// anywhere in the app, so this stays consistent with everything else rather than
// introducing a new backend concept just for this page.
const HOME_WIDGETS = [
    { id: 'alerts', title: 'Recent Alerts', icon: 'fa-triangle-exclamation', render: renderAlertsWidget },
    { id: 'risk', title: 'Top Risk Entities', icon: 'fa-gauge-high', render: renderRiskWidget },
];
const HOME_LAYOUT_KEY = 'microdfir_home_layout';

// Merges a saved layout with the current HOME_WIDGETS registry by id -- a widget
// added in a future update that isn't in an already-saved layout still shows up
// (appended, visible by default) instead of silently vanishing.
function loadHomeLayout() {
    let saved = [];
    try { saved = JSON.parse(localStorage.getItem(HOME_LAYOUT_KEY) || '[]'); } catch (e) { saved = []; }
    const knownIds = new Set(HOME_WIDGETS.map(w => w.id));
    const merged = saved.filter(s => knownIds.has(s.id)).map(s => ({id: s.id, visible: !!s.visible}));
    const mergedIds = new Set(merged.map(m => m.id));
    HOME_WIDGETS.forEach(w => { if (!mergedIds.has(w.id)) merged.push({id: w.id, visible: true}); });
    return merged;
}

function saveHomeLayout() {
    localStorage.setItem(HOME_LAYOUT_KEY, JSON.stringify(homeLayout));
}

let homeLayout = loadHomeLayout();

function renderHomeWidgets() {
    const container = document.getElementById('homeWidgetsContainer');
    const visible = homeLayout.filter(l => l.visible);
    container.innerHTML = visible.map((l, idx) => {
        const w = HOME_WIDGETS.find(x => x.id === l.id);
        if (!w) return '';
        return `
            <div class="col-lg-6">
                <div class="card bg-dark border-secondary h-100">
                    <div class="card-header d-flex justify-content-between align-items-center">
                        <span><i class="fa-solid ${w.icon} me-2"></i>${escHtml(w.title)}</span>
                        <div class="btn-group btn-group-sm">
                            <button type="button" class="btn btn-outline-secondary py-0 px-2" onclick="moveHomeWidget('${w.id}', -1)" ${idx === 0 ? 'disabled' : ''} title="Move up"><i class="fa-solid fa-chevron-up"></i></button>
                            <button type="button" class="btn btn-outline-secondary py-0 px-2" onclick="moveHomeWidget('${w.id}', 1)" ${idx === visible.length - 1 ? 'disabled' : ''} title="Move down"><i class="fa-solid fa-chevron-down"></i></button>
                            <button type="button" class="btn btn-outline-secondary py-0 px-2" onclick="hideHomeWidget('${w.id}')" title="Hide"><i class="fa-solid fa-eye-slash"></i></button>
                        </div>
                    </div>
                    <div class="card-body" id="homeWidgetBody-${w.id}"><p class="text-muted small mb-0">Loading…</p></div>
                </div>
            </div>
        `;
    }).join('');
    visible.forEach(l => { const w = HOME_WIDGETS.find(x => x.id === l.id); if (w) w.render(); });
    renderHiddenWidgetsRow();
}

function renderHiddenWidgetsRow() {
    const row = document.getElementById('homeHiddenWidgetsRow');
    const hidden = homeLayout.filter(l => !l.visible).map(l => HOME_WIDGETS.find(w => w.id === l.id)).filter(Boolean);
    if (!hidden.length) { row.style.display = 'none'; row.innerHTML = ''; return; }
    row.style.display = 'block';
    row.innerHTML = 'Hidden: ' + hidden.map(w =>
        `${escHtml(w.title)} <button type="button" class="btn btn-link btn-sm p-0 align-baseline" onclick="showHomeWidget('${w.id}')">show</button>`
    ).join(' &middot; ');
}

// Reorders within the visible subset only, then places hidden entries after --
// their relative order never affects rendering (they're listed, not positioned).
function moveHomeWidget(id, dir) {
    const visible = homeLayout.filter(l => l.visible);
    const hidden = homeLayout.filter(l => !l.visible);
    const pos = visible.findIndex(l => l.id === id);
    const newPos = pos + dir;
    if (pos === -1 || newPos < 0 || newPos >= visible.length) return;
    [visible[pos], visible[newPos]] = [visible[newPos], visible[pos]];
    homeLayout = visible.concat(hidden);
    saveHomeLayout();
    renderHomeWidgets();
}

function hideHomeWidget(id) {
    const entry = homeLayout.find(l => l.id === id);
    if (entry) entry.visible = false;
    saveHomeLayout();
    renderHomeWidgets();
}

function showHomeWidget(id) {
    const entry = homeLayout.find(l => l.id === id);
    if (entry) entry.visible = true;
    saveHomeLayout();
    renderHomeWidgets();
}

// ---- Widget content ----
function severityBadgeHome(sev) {
    const s = (sev || '').toUpperCase();
    const cls = (s === 'CRITICAL' || s === 'HIGH') ? 'bg-danger' : s === 'MEDIUM' ? 'bg-warning text-dark' : s === 'LOW' ? 'bg-secondary' : 'bg-info text-dark';
    return `<span class="badge ${cls}">${escHtml(s || 'INFO')}</span>`;
}

function renderAlertsWidget() {
    const body = document.getElementById('homeWidgetBody-alerts');
    if (!body) return;
    fetch('/api/alerts?limit=50')
        .then(r => r.json())
        .then(rows => {
            const unacked = (rows || []).filter(a => !a.acknowledged).slice(0, 8);
            if (!unacked.length) { body.innerHTML = '<p class="text-muted small mb-0">No unacknowledged alerts.</p>'; return; }
            body.innerHTML = `<div class="list-group list-group-flush">${unacked.map(a => `
                <div class="list-group-item bg-dark border-secondary px-0 py-2">
                    <div class="d-flex justify-content-between align-items-start gap-2">
                        <span class="small">${escHtml(a.rule_title)}</span>
                        <div class="d-flex align-items-center gap-1">
                            ${severityBadgeHome(a.severity)}
                            <button type="button" class="btn btn-outline-secondary btn-sm py-0 px-1" title="Acknowledge" onclick="acknowledgeAlert(${a.id}, this)"><i class="fa-solid fa-check"></i></button>
                        </div>
                    </div>
                    <div class="text-muted small">${escHtml(a.hostname || '—')} &middot; ${escHtml(a.timestamp)}</div>
                </div>
            `).join('')}</div>`;
        })
        .catch(err => { body.innerHTML = `<p class="text-danger small mb-0">Error loading alerts: ${escHtml(err)}</p>`; });
}

function acknowledgeAlert(aid, btn) {
    btn.disabled = true;
    // The quick-acknowledge button doubles as "mark resolved" for the triage lifecycle --
    // explicit here at the call site (not inferred server-side) so this is the one place
    // that decides acknowledged and status move together, matching PUT /api/alerts/<id>'s
    // deliberately independent-per-field design.
    fetch(`/api/alerts/${aid}`, {
        method: 'PUT', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({acknowledged: true, status: 'resolved'})
    }).then(r => r.json().then(data => ({ok: r.ok, data}))).then(({ok}) => {
        if (ok) {
            // The row this button lives in is now acknowledged and drops out of the
            // "unacknowledged" widget entirely -- just remove it rather than refetching.
            const row = btn.closest('.list-group-item');
            if (row) row.remove();
        } else {
            btn.disabled = false;
        }
    }).catch(() => { btn.disabled = false; });
}

function riskTierBadgeClassHome(tier) {
    return {Critical: 'bg-danger', High: 'bg-danger', Medium: 'bg-warning text-dark', Low: 'bg-secondary'}[tier] || 'bg-secondary';
}

function renderRiskWidget() {
    const body = document.getElementById('homeWidgetBody-risk');
    if (!body) return;
    fetch('/api/ueba/risk-scores')
        .then(r => r.json())
        .then(data => {
            const rows = (data.entities || []).slice(0, 8);
            if (!rows.length) { body.innerHTML = '<p class="text-muted small mb-0">No entities have scored any risk yet.</p>'; return; }
            body.innerHTML = `<div class="list-group list-group-flush">${rows.map(r => `
                <div class="list-group-item bg-dark border-secondary px-0 py-2 d-flex justify-content-between align-items-center">
                    <span class="small"><i class="fa-solid ${r.entity_type === 'host' ? 'fa-desktop' : 'fa-user'} me-1"></i>${escHtml(r.entity_id)}</span>
                    <span><span class="badge ${riskTierBadgeClassHome(r.tier)} me-1">${escHtml(r.tier)}</span><strong>${r.score}</strong></span>
                </div>
            `).join('')}</div>`;
        })
        .catch(err => { body.innerHTML = `<p class="text-danger small mb-0">Error loading risk scores: ${escHtml(err)}</p>`; });
}

// ---- Init ----
loadHomeStats();
renderHomeWidgets();
</script>
{% endblock %}
