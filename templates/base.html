<!DOCTYPE html><html lang="en" data-bs-theme="dark"><head><meta charset="UTF-8"><title>Micro DFIR Dashboard</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/gridstack@8.2.1/dist/gridstack.min.css" rel="stylesheet"/><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"><style>body{background-color:#121212;color:#e0e0e0;}.sidebar{height:100vh;width:250px;position:fixed;top:0;left:0;background-color:#1a1d20;border-right:1px solid #2d3238;padding-top:20px;display:flex;flex-direction:column;}.sidebar a{padding:15px 20px;text-decoration:none;font-size:1.1rem;color:#adb5bd;display:block;}.sidebar a:hover{background-color:#2d3238;color:#fff;border-left:3px solid #0d6efd;}.main-content{margin-left:250px;padding:20px;}.user-panel{margin-top:auto;padding:15px;border-top:1px solid #2d3238;background-color:#151719;}</style></head><body>
    <div class="sidebar"><div>
        <h4 class="text-center mb-4 text-primary"><i class="fa-solid fa-server"></i> Micro DFIR</h4>
        <a href="/"><i class="fa-solid fa-chart-line me-2"></i> Dashboard</a>
        <a href="/hunt"><i class="fa-solid fa-magnifying-glass me-2"></i> Threat Hunt</a>
        <a href="/rules"><i class="fa-solid fa-file-code me-2"></i> Detection Rules</a>
        <a href="/pipeline"><i class="fa-solid fa-filter me-2"></i> Log Pipeline</a>
        <a href="{{ url_for('settings') }}"><i class="fa-solid fa-cogs me-2"></i> Agents & Settings</a>
        
        <h6 class="sidebar-heading px-3 mt-4 mb-1 text-muted">EDR / Response</h6>
        <a href="https://{{ request.host.split(':')[0] }}:8889/" target="_blank"><i class="fa-solid fa-spider me-2"></i> Velociraptor GUI</a>
    </div><div class="user-panel text-center"><div class="small text-muted mb-2"><i class="fa-solid fa-user-shield text-success"></i> {{ current_user.username }} ({{ current_user.role }})</div><a href="/logout" class="btn btn-sm btn-outline-danger w-100"><i class="fa-solid fa-arrow-right-from-bracket"></i> Logout</a></div></div>
    <div class="main-content">{% block content %}{% endblock %}</div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script><script src="https://cdn.jsdelivr.net/npm/gridstack@8.2.1/dist/gridstack-all.js"></script>{% block scripts %}{% endblock %}
</body></html>
