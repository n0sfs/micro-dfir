{% extends "base.html" %}
{% block content %}
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
.mitre-grid { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(160px, 1fr); gap: 10px; overflow-x: auto; padding-bottom: 4px; }
.mitre-col { min-width: 0; }
.mitre-col-header { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.04em; color: var(--text-secondary, #96a0b0); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 6px; display: flex; justify-content: space-between; gap: 6px; }
.mitre-cells { display: flex; flex-direction: column; gap: 2px; max-height: 260px; overflow-y: auto; }
.mitre-cell { border-radius: 3px; padding: 2px 6px; font-size: 0.7rem; font-family: var(--bs-font-monospace, monospace); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: default; }

/* Widget grid -- each widget is a full-height card filling its grid cell; the card
   body gets an explicit height (grid cell height minus the header) rather than
   relying purely on flex/percentage sizing, since Chart.js's responsive:true needs
   a real, already-resolved pixel height on its canvas's parent to measure against. */
.grid-stack-item-content { overflow: hidden; }
.widget-card { height: 100%; display: flex; flex-direction: column; }
.widget-card .card-header { flex: 0 0 auto; }
.widget-body { flex: 1 1 auto; min-height: 0; overflow: auto; position: relative; }
.grid-stack.edit-mode .grid-stack-item-content { outline: 1px dashed var(--accent, #3b82f6); outline-offset: -1px; }
.widget-remove-btn { line-height: 1; }
</style>
<div class="page-header d-flex justify-content-between align-items-start flex-wrap gap-2">
    <div>
        <h2><i class="fa-solid fa-chart-line me-2"></i>Dashboards</h2>
        <p>Visual analytics across alerts, risk, detections, and endpoint health.</p>
        <div class="d-flex align-items-center gap-2 flex-wrap">
            <select id="dashboardSelect" class="form-select form-select-sm bg-dark text-light border-secondary" style="width:auto; min-width:180px;" onchange="switchDashboard(this.value)"></select>
            <button type="button" class="btn btn-sm btn-outline-secondary" title="New dashboard" onclick="showNewDashboardModal()"><i class="fa-solid fa-plus"></i></button>
            <button type="button" id="renameDashBtn" class="btn btn-sm btn-outline-secondary" title="Rename dashboard" style="display:none;" onclick="showRenameDashboardModal()"><i class="fa-solid fa-pen"></i></button>
            <button type="button" id="deleteDashBtn" class="btn btn-sm btn-outline-danger" title="Delete dashboard" style="display:none;" onclick="deleteCurrentDashboard()"><i class="fa-solid fa-trash"></i></button>
        </div>
    </div>
    <div class="d-flex align-items-center gap-2 flex-wrap">
        <select id="dashRangeSelect" class="form-select form-select-sm bg-dark text-light border-secondary" style="width:auto;" onchange="loadAllDashboards()">
            <option value="7d">Last 7 days</option>
            <option value="30d" selected>Last 30 days</option>
            <option value="90d">Last 90 days</option>
        </select>
        <button type="button" class="btn btn-sm btn-outline-primary" onclick="showAddWidgetModal()"><i class="fa-solid fa-plus me-1"></i>Add Widget</button>
        <button type="button" id="editModeToggle" class="btn btn-sm btn-outline-secondary" onclick="toggleEditMode()"><i class="fa-solid fa-arrows-up-down-left-right me-1"></i>Edit Layout</button>
    </div>
</div>

<div class="grid-stack" id="dashGrid"></div>

<!-- New Dashboard modal -->
<div class="modal fade" id="newDashboardModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content bg-dark border-secondary text-light">
            <div class="modal-header border-secondary">
                <h5 class="modal-title">New Dashboard</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <label class="form-label small text-muted">Name</label>
                <input type="text" id="newDashboardName" class="form-control bg-dark text-light border-secondary" placeholder="e.g. Tier 3 Triage" onkeyup="if(event.key === 'Enter') createDashboard()">
                <div id="newDashboardError" class="text-danger small mt-2" style="display:none;"></div>
            </div>
            <div class="modal-footer border-secondary">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                <button type="button" class="btn btn-primary" onclick="createDashboard()">Create</button>
            </div>
        </div>
    </div>
</div>

<!-- Rename Dashboard modal -->
<div class="modal fade" id="renameDashboardModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content bg-dark border-secondary text-light">
            <div class="modal-header border-secondary">
                <h5 class="modal-title">Rename Dashboard</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <label class="form-label small text-muted">Name</label>
                <input type="text" id="renameDashboardName" class="form-control bg-dark text-light border-secondary" onkeyup="if(event.key === 'Enter') renameDashboard()">
                <div id="renameDashboardError" class="text-danger small mt-2" style="display:none;"></div>
            </div>
            <div class="modal-footer border-secondary">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                <button type="button" class="btn btn-primary" onclick="renameDashboard()">Save</button>
            </div>
        </div>
    </div>
</div>

<!-- Add Widget picker modal -->
<div class="modal fade" id="addWidgetModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
        <div class="modal-content bg-dark border-secondary text-light">
            <div class="modal-header border-secondary">
                <h5 class="modal-title">Add Widget</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body" id="addWidgetBody"></div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
const IS_ADMIN = {{ 'true' if current_user.role == 'admin' else 'false' }};
const CURRENT_USERNAME = {{ current_user.username|tojson }};

function escHtml(s) {
    return (s === null || s === undefined) ? '' : String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function titleCase(s) {
    return (s || 'Unknown').replace(/\w\S*/g, t => t.charAt(0).toUpperCase() + t.slice(1).toLowerCase());
}

let DASH_CHARTS = {};

function destroyChart(key) {
    if (DASH_CHARTS[key]) { DASH_CHARTS[key].destroy(); delete DASH_CHARTS[key]; }
}

// A couple of the app_* widgets (Batch 2) poll on their own timer -- tracked by
// widgetId so removeWidget()/switchDashboard() can clear the interval instead of
// leaving it ticking forever against a widget body that no longer exists.
let WIDGET_INTERVALS = {};

function clearWidgetInterval(wid) {
    if (WIDGET_INTERVALS[wid]) { clearInterval(WIDGET_INTERVALS[wid]); delete WIDGET_INTERVALS[wid]; }
}

// Reads the app's own theme CSS custom properties (already flipped by base.html's
// light/dark toggle -- see :root / html[data-bs-theme="light"] in base.html) instead
// of hardcoding a light and a dark palette here. Whatever the current theme is, these
// colors are already correct for it.
function chartTheme() {
    const cs = getComputedStyle(document.documentElement);
    const v = (name, fallback) => (cs.getPropertyValue(name) || '').trim() || fallback;
    return {
        text: v('--text-secondary', '#96a0b0'),
        grid: v('--border', '#232a35'),
        accent: v('--accent', '#3b82f6'),
        success: v('--success', '#22c55e'),
        warning: v('--warning', '#f59e0b'),
        danger: v('--danger', '#ef4444'),
        info: v('--info', '#38bdf8'),
        muted: v('--text-muted', '#5e6b7d'),
    };
}

// config.range overrides the page-level selector for one widget instance -- no UI
// exposes this yet (every seeded/added widget has an empty config), but the plumbing
// is here so a per-widget range control can be added later as a purely additive change.
function widgetRange(config) {
    return (config && config.range) || document.getElementById('dashRangeSelect').value;
}

function baseLineOptions(c) {
    return {
        responsive: true, maintainAspectRatio: false,
        plugins: { legend: { display: false } },
        scales: {
            x: { grid: { color: c.grid }, ticks: { color: c.text, maxTicksLimit: 10 } },
            y: { grid: { color: c.grid }, ticks: { color: c.text }, beginAtZero: true },
        },
    };
}

function baseHBarOptions(c) {
    return {
        indexAxis: 'y', responsive: true, maintainAspectRatio: false,
        plugins: { legend: { display: false } },
        scales: {
            x: { grid: { color: c.grid }, ticks: { color: c.text }, beginAtZero: true },
            y: { grid: { display: false }, ticks: { color: c.text, autoSkip: false } },
        },
    };
}

function renderAlertTrendWidget(container, widgetId, config) {
    container.innerHTML = '<canvas></canvas>';
    const canvas = container.querySelector('canvas');
    fetch(`/api/dashboards/alert-trend?range=${widgetRange(config)}`).then(r => r.json()).then(d => {
        const c = chartTheme();
        destroyChart(widgetId);
        DASH_CHARTS[widgetId] = new Chart(canvas.getContext('2d'), {
            type: 'line',
            data: { labels: d.trend.map(x => x.t_bucket), datasets: [{
                label: 'Alerts', data: d.trend.map(x => x.count),
                borderColor: c.accent, backgroundColor: c.accent + '26',
                borderWidth: 2, fill: true, tension: 0.25, pointRadius: 2,
            }] },
            options: baseLineOptions(c),
        });
    }).catch(err => console.error('Error loading alert trend:', err));
}

function severityColor(sev, c) {
    const s = (sev || '').toLowerCase();
    if (s === 'critical' || s === 'high') return c.danger;
    if (s === 'medium') return c.warning;
    if (s === 'low') return c.muted;
    return c.info; // informational / anything unrecognized
}

function renderSeverityWidget(container, widgetId, config) {
    container.innerHTML = '<canvas></canvas>';
    const canvas = container.querySelector('canvas');
    fetch(`/api/dashboards/alert-severity?range=${widgetRange(config)}`).then(r => r.json()).then(d => {
        const c = chartTheme();
        destroyChart(widgetId);
        DASH_CHARTS[widgetId] = new Chart(canvas.getContext('2d'), {
            type: 'doughnut',
            data: {
                labels: d.severity.map(x => titleCase(x.severity)),
                datasets: [{ data: d.severity.map(x => x.count), backgroundColor: d.severity.map(x => severityColor(x.severity, c)), borderColor: 'transparent' }],
            },
            options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'bottom', labels: { color: c.text, boxWidth: 12 } } } },
        });
    }).catch(err => console.error('Error loading severity breakdown:', err));
}

function renderRiskTrendWidget(container, widgetId, config) {
    container.innerHTML = '<canvas></canvas>';
    const canvas = container.querySelector('canvas');
    fetch(`/api/dashboards/risk-trend?range=${widgetRange(config)}`).then(r => r.json()).then(d => {
        const c = chartTheme();
        destroyChart(widgetId);
        DASH_CHARTS[widgetId] = new Chart(canvas.getContext('2d'), {
            type: 'line',
            data: { labels: d.trend.map(x => x.day), datasets: [{
                label: 'Risk Points', data: d.trend.map(x => x.total_points),
                borderColor: c.warning, backgroundColor: c.warning + '26',
                borderWidth: 2, fill: true, tension: 0.25, pointRadius: 2,
            }] },
            options: baseLineOptions(c),
        });
    }).catch(err => console.error('Error loading risk trend:', err));
}

function entityIcon(t) {
    return t === 'host' ? '<i class="fa-solid fa-desktop text-info me-1"></i>' : '<i class="fa-solid fa-user text-warning me-1"></i>';
}

function tierBadgeClass(tier) {
    return { Critical: 'bg-danger', High: 'bg-danger', Medium: 'bg-warning text-dark', Low: 'bg-secondary' }[tier] || 'bg-secondary';
}

function renderTopRiskWidget(container, widgetId, config) {
    container.innerHTML = `
        <table class="table table-dark table-hover table-sm align-middle mb-0">
            <thead><tr><th>Entity</th><th>Score</th><th>Tier</th></tr></thead>
            <tbody><tr><td colspan="3" class="text-center text-muted py-3">Loading…</td></tr></tbody>
        </table>`;
    fetch(`/api/dashboards/top-risk-entities?range=${widgetRange(config)}`).then(r => r.json()).then(d => {
        const body = container.querySelector('tbody');
        if (!d.entities.length) {
            body.innerHTML = '<tr><td colspan="3" class="text-center text-muted py-3">No risk activity in this window.</td></tr>';
            return;
        }
        body.innerHTML = d.entities.map(e => `
            <tr>
                <td class="small">${entityIcon(e.entity_type)}${escHtml(e.entity_id)}</td>
                <td>${e.score}</td>
                <td><span class="badge ${tierBadgeClass(e.tier)}">${escHtml(e.tier)}</span></td>
            </tr>`).join('');
    }).catch(err => console.error('Error loading top risk entities:', err));
}

function renderAnomalyRulesWidget(container, widgetId, config) {
    container.innerHTML = '<canvas></canvas>';
    const canvas = container.querySelector('canvas');
    fetch(`/api/dashboards/top-anomaly-rules?range=${widgetRange(config)}`).then(r => r.json()).then(d => {
        const c = chartTheme();
        destroyChart(widgetId);
        DASH_CHARTS[widgetId] = new Chart(canvas.getContext('2d'), {
            type: 'bar',
            data: { labels: d.rules.map(x => x.name), datasets: [{ label: 'Matches', data: d.rules.map(x => x.matches), backgroundColor: c.accent }] },
            options: baseHBarOptions(c),
        });
    }).catch(err => console.error('Error loading top anomaly rules:', err));
}

function renderCountriesWidget(container, widgetId, config) {
    container.innerHTML = '<canvas></canvas>';
    const canvas = container.querySelector('canvas');
    fetch(`/api/dashboards/top-countries?range=${widgetRange(config)}`).then(r => r.json()).then(d => {
        const c = chartTheme();
        destroyChart(widgetId);
        DASH_CHARTS[widgetId] = new Chart(canvas.getContext('2d'), {
            type: 'bar',
            data: { labels: d.countries.map(x => x.country || x.iso_code), datasets: [{ label: 'Alerts', data: d.countries.map(x => x.count), backgroundColor: c.info }] },
            options: baseHBarOptions(c),
        });
    }).catch(err => console.error('Error loading top countries:', err));
}

function renderAgentStatusWidget(container, widgetId, config) {
    container.innerHTML = '<canvas></canvas><p class="text-muted small text-center mb-0 pt-4 widget-empty" style="display:none;">No agents have checked in yet.</p>';
    const canvas = container.querySelector('canvas');
    const empty = container.querySelector('.widget-empty');
    fetch('/api/dashboards/agent-status').then(r => r.json()).then(d => {
        destroyChart(widgetId);
        if (!d.total) {
            canvas.style.display = 'none';
            empty.style.display = 'block';
            return;
        }
        canvas.style.display = '';
        empty.style.display = 'none';
        const c = chartTheme();
        const order = ['Online', 'Idle', 'Offline', 'Unknown'];
        const colorMap = { Online: c.success, Idle: c.warning, Offline: c.danger, Unknown: c.muted };
        const labels = order.filter(k => d.status_counts[k] > 0);
        DASH_CHARTS[widgetId] = new Chart(canvas.getContext('2d'), {
            type: 'doughnut',
            data: { labels, datasets: [{ data: labels.map(k => d.status_counts[k]), backgroundColor: labels.map(k => colorMap[k]), borderColor: 'transparent' }] },
            options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'bottom', labels: { color: c.text, boxWidth: 12 } } } },
        });
    }).catch(err => console.error('Error loading agent status:', err));
}

// Count 0 -> a flat muted cell (a real gap in coverage, not "no data yet" --
// every curated technique is always present regardless of count). Count > 0
// scales from accent toward danger so heavily-covered techniques stand out
// from a rule or two just as easily as a glance at a bar chart would.
function mitreCellStyle(count, c) {
    if (count === 0) return `background:${c.grid}; color:${c.muted};`;
    const step = Math.min(count, 5) / 5;
    const color = step < 0.5 ? c.info : (step < 0.85 ? c.accent : c.danger);
    return `background:${color}33; color:${color}; font-weight:600;`;
}

function renderMitreCoverageWidget(container, widgetId, config) {
    container.innerHTML = `
        <div class="mitre-grid"></div>
        <div class="small text-muted mt-2 widget-unmapped" style="display:none;"></div>
        <p class="text-muted small text-center mb-0 py-3 widget-empty" style="display:none;">No enabled rules carry MITRE ATT&CK tags yet.</p>`;
    const grid = container.querySelector('.mitre-grid');
    const unmappedEl = container.querySelector('.widget-unmapped');
    const emptyEl = container.querySelector('.widget-empty');
    fetch('/api/mitre/coverage').then(r => r.json()).then(d => {
        const c = chartTheme();
        const anyCoverage = d.tactics.some(t => t.covered > 0) || (d.unmapped && d.unmapped.length);
        emptyEl.style.display = anyCoverage ? 'none' : 'block';

        grid.innerHTML = d.tactics.map(t => `
            <div class="mitre-col">
                <div class="mitre-col-header" title="${escHtml(t.label)}">
                    <span>${escHtml(t.label)}</span>
                    <span>${t.covered}/${t.total}</span>
                </div>
                <div class="mitre-cells">
                    ${t.techniques.map(tech => `
                        <div class="mitre-cell" style="${mitreCellStyle(tech.count, c)}" title="T${escHtml(tech.id)} ${escHtml(tech.name || '')} — ${tech.count} enabled rule${tech.count === 1 ? '' : 's'}">
                            T${escHtml(tech.id)}${tech.count > 0 ? ` (${tech.count})` : ''}
                        </div>`).join('')}
                </div>
            </div>`).join('');

        if (d.unmapped && d.unmapped.length) {
            unmappedEl.style.display = 'block';
            unmappedEl.innerHTML = '<i class="fa-solid fa-triangle-exclamation me-1"></i>Tagged but not in the reference table: ' +
                d.unmapped.map(u => `T${escHtml(u.id)} (${u.count})`).join(', ');
        } else {
            unmappedEl.style.display = 'none';
        }
    }).catch(err => console.error('Error loading MITRE coverage:', err));
}

function actorTypeBadge(type) {
    const map = { actor: 'bg-danger', ransomware: 'bg-danger', malware: 'bg-warning text-dark', tool: 'bg-info text-dark' };
    return `<span class="badge ${map[type] || 'bg-secondary'}">${escHtml(type)}</span>`;
}

function renderActorSummaryWidget(container, widgetId, config) {
    container.innerHTML = `
        <div class="row g-2 widget-grid"></div>
        <p class="text-muted small text-center mb-0 py-3 widget-empty" style="display:none;">No known actor/malware names recognized in the currently-synced IOC set.</p>`;
    const grid = container.querySelector('.widget-grid');
    const empty = container.querySelector('.widget-empty');
    fetch('/api/ti/actor-summary').then(r => r.json()).then(d => {
        if (!d.actors.length) {
            grid.innerHTML = '';
            empty.style.display = 'block';
            return;
        }
        empty.style.display = 'none';
        grid.innerHTML = d.actors.map(a => `
            <div class="col-md-6 col-lg-4">
                <a href="/threat-intel?entity=${a.id}" class="text-decoration-none text-reset d-block h-100" title="View entity detail">
                <div class="border border-secondary rounded p-2 h-100" style="cursor:pointer;" onmouseover="this.style.borderColor='var(--accent)'" onmouseout="this.style.borderColor=''">
                    <div class="d-flex justify-content-between align-items-start mb-1">
                        <strong>${escHtml(a.name)}</strong>
                        ${actorTypeBadge(a.type)}
                    </div>
                    ${a.aliases.length ? `<div class="text-muted small mb-1">aka ${escHtml(a.aliases.join(', '))}</div>` : ''}
                    <div class="small text-secondary mb-2">${escHtml(a.description)}</div>
                    <div class="small mb-1"><span class="badge bg-secondary">${a.ioc_count} matching IOC${a.ioc_count === 1 ? '' : 's'}</span></div>
                    <div class="small">
                        ${a.techniques.map(t => `<span class="badge bg-secondary me-1 mb-1" title="${escHtml(t.tactic_label)}">T${escHtml(t.id)}</span>`).join('')}
                    </div>
                </div>
                </a>
            </div>`).join('');
    }).catch(err => console.error('Error loading actor summary:', err));
}

// A concise, human-scale duration for a stat tile -- 45m / 3.2h / 2.1d, not a raw
// hour count that reads fine at 6 but awkwardly at 340.
function hoursLabel(h) {
    if (h === null || h === undefined) return '—';
    if (h < 1) return `${Math.round(h * 60)}m`;
    if (h < 48) return `${h.toFixed(1)}h`;
    return `${(h / 24).toFixed(1)}d`;
}

function renderCaseStatsWidget(container, widgetId, config) {
    container.innerHTML = `
        <div class="d-flex justify-content-end small text-muted mb-2">
            SLA target: <span class="widget-sla-display ms-1">&hellip;</span>h
            <a href="#" class="widget-sla-edit-link ms-1" onclick="startEditCaseSla(${widgetId}); return false;" style="display:none;">Edit</a>
            <span class="widget-sla-edit-wrap ms-1" style="display:none;">
                <input type="number" class="widget-sla-input form-control form-control-sm bg-dark text-light border-secondary d-inline-block" min="1" max="8760" style="width:70px;">
                <button type="button" class="btn btn-sm btn-outline-primary py-0 px-2" onclick="saveCaseSla(${widgetId})">Save</button>
                <button type="button" class="btn btn-sm btn-outline-secondary py-0 px-2" onclick="cancelEditCaseSla(${widgetId})">Cancel</button>
            </span>
        </div>
        <div class="row g-2 text-center">
            <div class="col-3"><div class="fs-4 fw-bold widget-open">&mdash;</div><div class="small text-muted">Open Cases</div></div>
            <div class="col-3"><div class="fs-4 fw-bold text-danger widget-breached">&mdash;</div><div class="small text-muted">SLA Breached</div></div>
            <div class="col-3"><div class="fs-4 fw-bold widget-avg-close">&mdash;</div><div class="small text-muted">Avg Time to Close</div></div>
            <div class="col-3"><div class="fs-4 fw-bold widget-closed-range">&mdash;</div><div class="small text-muted">Closed (range)</div></div>
        </div>`;
    loadCaseStatsInto(container, config);
}

function loadCaseStatsInto(container, config) {
    fetch(`/api/dashboards/case-stats?range=${widgetRange(config)}`).then(r => r.json()).then(d => {
        container.querySelector('.widget-open').innerText = d.open_count;
        container.querySelector('.widget-breached').innerText = d.sla_breached_count;
        container.querySelector('.widget-avg-close').innerText = hoursLabel(d.avg_close_hours);
        container.querySelector('.widget-closed-range').innerText = d.closed_in_range_count;
        container.querySelector('.widget-sla-display').innerText = d.sla_target_hours;
        container.querySelector('.widget-sla-input').value = d.sla_target_hours;
        if (IS_ADMIN) container.querySelector('.widget-sla-edit-link').style.display = '';
    }).catch(err => console.error('Error loading case stats:', err));
}

function startEditCaseSla(widgetId) {
    const container = document.getElementById(`widgetBody_${widgetId}`);
    container.querySelector('.widget-sla-edit-link').style.display = 'none';
    container.querySelector('.widget-sla-edit-wrap').style.display = 'inline-block';
}

function cancelEditCaseSla(widgetId) {
    const container = document.getElementById(`widgetBody_${widgetId}`);
    container.querySelector('.widget-sla-edit-wrap').style.display = 'none';
    container.querySelector('.widget-sla-edit-link').style.display = '';
    loadCaseStatsInto(container, RENDERED_WIDGETS[widgetId] ? RENDERED_WIDGETS[widgetId].config : {});
}

function saveCaseSla(widgetId) {
    const container = document.getElementById(`widgetBody_${widgetId}`);
    const hours = parseInt(container.querySelector('.widget-sla-input').value, 10);

function severityBadgeWidget(sev) {
    const s = (sev || '').toUpperCase();
    const cls = (s === 'CRITICAL' || s === 'HIGH') ? 'bg-danger' : s === 'MEDIUM' ? 'bg-warning text-dark' : s === 'LOW' ? 'bg-secondary' : 'bg-info text-dark';
    return `<span class="badge ${cls}">${escHtml(s || 'INFO')}</span>`;
}

// Mirrors home.html's acknowledgeAlert() exactly -- acknowledged and status move
// together (marks resolved), the one place that decides that, matching PUT
// /api/alerts/<id>'s deliberately independent-per-field design.
function ackAlertWidget(aid, btn) {
    btn.disabled = true;
    fetch(`/api/alerts/${aid}`, {
        method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ acknowledged: true, status: 'resolved' })
    }).then(r => r.json().then(data => ({ ok: r.ok, data }))).then(({ ok }) => {
        if (ok) {
            const row = btn.closest('.list-group-item');
            if (row) row.remove();
        } else {
            btn.disabled = false;
        }
    }).catch(() => { btn.disabled = false; });
}

function renderAlertsWidget(container, widgetId, config) {
    clearWidgetInterval(widgetId);
    container.innerHTML = `
        <div class="d-flex justify-content-end mb-1"><a href="/" class="small">View all &raquo;</a></div>
        <div class="widget-alerts-list"><p class="text-muted small mb-0">Loading&hellip;</p></div>`;
    const load = () => {
        fetch(`/api/alerts?limit=${config.limit || 8}`).then(r => r.json()).then(rows => {
            const list = container.querySelector('.widget-alerts-list');
            if (!list) return; // the widget was removed while this poll's fetch was in flight
            const unacked = (rows || []).filter(a => !a.acknowledged).slice(0, config.limit || 8);
            if (!unacked.length) { list.innerHTML = '<p class="text-muted small mb-0">No unacknowledged alerts.</p>'; return; }
            list.innerHTML = `<div class="list-group list-group-flush">${unacked.map(a => `
                <div class="list-group-item bg-dark border-secondary px-0 py-2">
                    <div class="d-flex justify-content-between align-items-start gap-2">
                        <span class="small">${escHtml(a.rule_title)}</span>
                        <div class="d-flex align-items-center gap-1">
                            ${severityBadgeWidget(a.severity)}
                            <button type="button" class="btn btn-outline-secondary btn-sm py-0 px-1" title="Acknowledge" onclick="ackAlertWidget(${a.id}, this)"><i class="fa-solid fa-check"></i></button>
                        </div>
                    </div>
                    <div class="text-muted small">${escHtml(a.hostname || '—')} &middot; ${escHtml(a.timestamp)}</div>
                </div>
            `).join('')}</div>`;
        }).catch(err => console.error('Error loading alerts widget:', err));
    };
    load();
    // Alerts aren't range-parameterized like the chart widgets -- this is the widget's
    // own timer, not the page-level "Live" convention, since it also drives the ack
    // list dropping an entry the moment someone (possibly on another screen) acks it.
    WIDGET_INTERVALS[widgetId] = setInterval(load, 30000);
}

function renderLogSearchWidget(container, widgetId, config) {
    container.innerHTML = `
        <div class="input-group input-group-sm mb-2">

        </div>
        <div class="widget-log-results"></div>`;
    const input = container.querySelector('.widget-log-q');
    const results = container.querySelector('.widget-log-results');
    // A user-typed search is real search activity and stays audited server-side like
    // any other Log Search query -- poll=1 (which suppresses that audit entry) is
    // reserved for a widget's own unattended timer refresh, and this widget doesn't
    // run one by default (see the app_log_search registry note below).
    const runSearch = () => {
        const q = input.value.trim();
        results.innerHTML = '<p class="text-muted small mb-0">Loading&hellip;</p>';
        const params = new URLSearchParams({ q, range: config.range || '24h', limit: config.limit || 10 });
        fetch(`/api/logs/search?${params}`).then(r => r.json()).then(d => {
            const logs = d.logs || [];
            if (!logs.length) { results.innerHTML = '<p class="text-muted small mb-0">No matching logs.</p>'; return; }
            results.innerHTML = `
                <table class="table table-dark table-sm align-middle mb-0">
                    <thead><tr><th>Time</th><th>Host</th><th>Message</th></tr></thead>
                    <tbody>${logs.map(l => `

function renderThreatHunterWidget(container, widgetId, config) {
    container.innerHTML = `
        <div class="input-group input-group-sm mb-2">
            <input type="text" class="form-control bg-dark text-light border-secondary widget-ioc-input" placeholder="IP, domain, URL, or file hash...">
            <button class="btn btn-outline-secondary widget-ioc-btn" type="button"><i class="fa-solid fa-magnifying-glass"></i></button>
        </div>
        <div class="widget-ioc-result small"><span class="text-muted">Enter a value to check.</span></div>`;
    const input = container.querySelector('.widget-ioc-input');
    const resultEl = container.querySelector('.widget-ioc-result');
    const runLookup = () => {
        const ioc = input.value.trim();
        if (!ioc) { resultEl.innerHTML = '<span class="text-muted">Enter a value to check.</span>'; return; }
        resultEl.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i>';
        fetch('/api/ti/lookup', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ ioc }) })
            .then(r => r.json().then(data => ({ ok: r.ok, data })))
            .then(({ ok, data }) => {
                if (!ok) { resultEl.innerHTML = `<span class="text-danger">${escHtml(data.message || 'Lookup failed.')}</span>`; return; }
                if (data.status === 'clean') {
                    resultEl.innerHTML = '<span class="text-success"><i class="fa-solid fa-circle-check me-1"></i>No match in the local IOC set.</span>';
                } else if (data.status === 'revoked') {
                    resultEl.innerHTML = `<span class="text-muted"><i class="fa-solid fa-circle-minus me-1"></i>Matches ${data.matches.length} revoked/inactive indicator(s) only.</span>`;
                } else {
                    const m = data.matches.find(x => !x.revoked) || data.matches[0];
                    const sightingNote = m.sighting_count > 0 ? `, observed here ${m.sighting_count}x` : ', never observed here';
                    resultEl.innerHTML = `<span class="text-danger"><i class="fa-solid fa-triangle-exclamation me-1"></i>MATCH — ${escHtml(m.name || m.ioc_type)} (${escHtml(m.source_name || 'Unknown')}${sightingNote})</span>`;
                }
            }).catch(err => { resultEl.innerHTML = `<span class="text-danger">Error: ${escHtml(String(err))}</span>`; });
    };
    container.querySelector('.widget-ioc-btn').addEventListener('click', runLookup);
    input.addEventListener('keyup', (e) => { if (e.key === 'Enter') runLookup(); });
}

function renderEdrActionsWidget(container, widgetId, config) {
    clearWidgetInterval(widgetId);
    // The queue mini-form is hidden entirely (not just disabled) for a non-admin --
    // the backend 403s a non-admin POST anyway, this just avoids a dead-end submit,
    // same convention as the admin-only controls elsewhere in this app (e.g. ueba.html).
    const formHtml = IS_ADMIN ? `
        <div class="row g-1 mb-2">
            <div class="col-5"><select class="form-select form-select-sm bg-dark text-light border-secondary widget-edr-host"><option value="">Host&hellip;</option></select></div>
            <div class="col-5"><select class="form-select form-select-sm bg-dark text-light border-secondary widget-edr-action">${EDR_WIDGET_SAFE_ACTIONS.map(a => `<option value="${a.label}">${escHtml(a.text)}</option>`).join('')}</select></div>
            <div class="col-2"><button type="button" class="btn btn-sm btn-outline-danger w-100 widget-edr-queue-btn" title="Queue action"><i class="fa-solid fa-bolt"></i></button></div>
        </div>` : '';
    container.innerHTML = `${formHtml}<div class="widget-edr-history"><p class="text-muted small mb-0">Loading&hellip;</p></div>`;

    if (IS_ADMIN) {
        const hostSelect = container.querySelector('.widget-edr-host');
        fetch('/api/agent/checkins').then(r => r.json()).then(hosts => {
            if (!hostSelect.isConnected) return;
            hostSelect.innerHTML = '<option value="">Host&hellip;</option>' + (hosts || [])
                .filter(h => h.status !== 'Offline')
                .map(h => `<option value="${escHtml(h.hostname)}">${escHtml(h.hostname)} (${escHtml(h.status)})</option>`).join('');
        }).catch(err => console.error('Error loading agent checkins:', err));

        container.querySelector('.widget-edr-queue-btn').addEventListener('click', async () => {
            const hostname = hostSelect.value;
            const label = container.querySelector('.widget-edr-action').value;
            if (!hostname) { toast('Choose a host first.', 'warning'); return; }
            const actionText = (EDR_WIDGET_SAFE_ACTIONS.find(a => a.label === label) || {}).text || label;
            if (!(await confirmDialog(`${actionText} on ${hostname}?`, { title: 'Confirm action', danger: true }))) return;
            fetch('/api/agent/commands', {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ hostname, label, params: {} }),
            }).then(r => r.json().then(data => ({ ok: r.ok, data }))).then(({ ok, data }) => {
                if (ok) {
                    toast(`"${actionText}" queued for ${hostname}.`, 'success');
                    loadEdrHistory();
                } else {
                    toast(data.error || 'Failed to queue command.', 'danger');
                }
            }).catch(err => toast('Error queuing command: ' + err, 'danger'));
        });
    }

    const loadEdrHistory = () => {
        fetch(`/api/agent/commands?limit=${config.limit || 8}`).then(r => r.json()).then(rows => {
            const hist = container.querySelector('.widget-edr-history');
            if (!hist) return; // widget was removed while this poll's fetch was in flight
            if (!rows.length) { hist.innerHTML = '<p class="text-muted small mb-0">No response actions queued yet.</p>'; return; }
            hist.innerHTML = `
                <table class="table table-dark table-sm align-middle mb-0">
                    <thead><tr><th>Host</th><th>Action</th><th>Status</th><th>Queued</th></tr></thead>
                    <tbody>${rows.map(c => `
                        <tr>
                            <td class="small">${escHtml(c.hostname)}</td>
                            <td class="small">${escHtml(c.label)}</td>
                            <td>${edrStatusBadgeWidget(c.status)}</td>
                            <td class="small text-nowrap">${escHtml(c.queued_at)}</td>
                        </tr>`).join('')}</tbody>
                </table>`;
        }).catch(err => console.error('Error loading EDR command history:', err));
    };
    loadEdrHistory();
    WIDGET_INTERVALS[widgetId] = setInterval(loadEdrHistory, 30000);
}

// widgetId (number) -> {widget_type, config} for whatever's actually on screen right
// now -- drives loadAllDashboards()'s refresh and the theme-toggle refresh, since
// there can be zero, one, or several instances of any widget type on a dashboard.
let RENDERED_WIDGETS = {};

function loadAllDashboards() {
    Object.entries(RENDERED_WIDGETS).forEach(([wid, w]) => {
        const def = WIDGET_REGISTRY[w.widget_type];
        const container = document.getElementById(`widgetBody_${wid}`);
        if (def && container) def.render(container, Number(wid), w.config || {});
    });
}

// Charts are built once with whatever theme was active at load time -- re-run
// everything when the shared toggle flips so colors stay correct, without touching
// base.html's toggleTheme() itself (this page just wraps the global it already
// exposes, same pattern this app uses when a page needs to react to an event a
// shared component doesn't natively emit).
if (typeof window.toggleTheme === 'function') {
    const _origToggleTheme = window.toggleTheme;
    window.toggleTheme = function() {
        _origToggleTheme();
        loadAllDashboards();
    };
}

function debounce(fn, ms) {
    let t;
    return (...args) => { clearTimeout(t); t = setTimeout(() => fn(...args), ms); };
}

let grid = null;
let currentDashboardId = null;
let allDashboards = [];

function initGrid() {
    grid = GridStack.init({
        column: 12,
        cellHeight: 60,
        float: false,       // packs widgets upward on remove, matching today's dense layout
        staticGrid: true,   // view mode by default -- dragging is opt-in via "Edit Layout"
        margin: 8,
    }, '#dashGrid');
    grid.on('change', debounce(persistLayout, 600));
    grid.on('resize', (event, el) => {
        const wid = Number(el.gridstackNode.id);
        if (DASH_CHARTS[wid]) DASH_CHARTS[wid].resize();
    });
}

function toggleEditMode() {
    const enteringEdit = !!grid.opts.staticGrid;
    grid.setStatic(!enteringEdit);
    document.getElementById('dashGrid').classList.toggle('edit-mode', enteringEdit);
    const btn = document.getElementById('editModeToggle');
    btn.classList.toggle('btn-primary', enteringEdit);
    btn.classList.toggle('btn-outline-secondary', !enteringEdit);
}

function persistLayout() {
    if (!currentDashboardId || !grid) return;
    const layout = grid.save(false); // false = layout only, no widget content
    fetch(`/api/dashboards/${currentDashboardId}/widgets/layout`, {
        method: 'PUT', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(layout.map(item => ({ id: Number(item.id), x: item.x, y: item.y, w: item.w, h: item.h }))),
    }).catch(err => console.error('Error persisting layout:', err));
}

function addWidgetToGrid(w) {
    const def = WIDGET_REGISTRY[w.widget_type];
    if (!def) return; // an unrecognized widget_type (e.g. added by a future version) -- degrade gracefully instead of throwing
    RENDERED_WIDGETS[w.id] = { widget_type: w.widget_type, config: w.config || {} };
    const liveBadge = def.live ? '<span class="badge bg-secondary me-1" title="Reflects current state, not the selected time range">Live</span>' : '';
    grid.addWidget({
        id: String(w.id), x: w.x, y: w.y, w: w.w, h: w.h,
        content: `<div class="card bg-dark border-secondary widget-card">
            <div class="card-header border-secondary d-flex justify-content-between align-items-center">
                <span><i class="fa-solid ${def.icon} me-2"></i>${escHtml(def.label)}</span>
                <span class="d-flex align-items-center">${liveBadge}<button type="button" class="btn btn-sm btn-link text-muted p-0 widget-remove-btn" onclick="removeWidget(${w.id})" title="Remove"><i class="fa-solid fa-xmark"></i></button></span>
            </div>
            <div class="card-body widget-body" id="widgetBody_${w.id}"></div>
        </div>`,
    });
    // Rendered synchronously, right after grid.addWidget() returns -- GridStack
    // applies the grid item's layout (and so a real, non-zero pixel height) inline
    // and immediately as part of addWidget() itself, so the container already has
    // a real height by the time Chart.js measures it here. (Deliberately NOT
    // deferred via requestAnimationFrame: rAF callbacks are suspended entirely in a
    // backgrounded/unfocused tab, which would leave every widget stuck on "Loading"
    // until the tab regains focus -- confirmed live, not a hypothetical.)
    const container = document.getElementById(`widgetBody_${w.id}`);
    if (container) def.render(container, w.id, w.config || {});
}

function removeWidget(wid) {
    const el = grid.getGridItems().find(item => item.gridstackNode && String(item.gridstackNode.id) === String(wid));
    if (el) grid.removeWidget(el);
    destroyChart(wid);
    clearWidgetInterval(wid);
    delete RENDERED_WIDGETS[wid];
    fetch(`/api/dashboards/${currentDashboardId}/widgets/${wid}`, { method: 'DELETE' })
        .catch(err => console.error('Error removing widget:', err));
}

async function switchDashboard(did) {
    currentDashboardId = Number(did);
    try { localStorage.setItem('microdfir_last_dashboard', did); } catch (e) {}
    Object.keys(DASH_CHARTS).forEach(destroyChart);
    Object.keys(WIDGET_INTERVALS).forEach(clearWidgetInterval);
    RENDERED_WIDGETS = {};
    grid.removeAll();
    updateDashOwnerControls();
    const widgets = await fetch(`/api/dashboards/${did}/widgets`).then(r => r.json());
    widgets.forEach(addWidgetToGrid);
}

function updateDashOwnerControls() {
    const dash = allDashboards.find(d => d.id === currentDashboardId);
    const canManage = !!dash && (IS_ADMIN || dash.created_by === CURRENT_USERNAME);
    document.getElementById('renameDashBtn').style.display = canManage ? '' : 'none';
    document.getElementById('deleteDashBtn').style.display = canManage ? '' : 'none';
}

function populateDashboardSelect() {
    const sel = document.getElementById('dashboardSelect');
    sel.innerHTML = allDashboards.map(d => `<option value="${d.id}" ${d.id === currentDashboardId ? 'selected' : ''}>${escHtml(d.name)}</option>`).join('');
}

async function loadDashboards() {
    allDashboards = await fetch('/api/dashboards').then(r => r.json());
    if (!allDashboards.length) return; // migrate_dashboards() always seeds "Overview" -- shouldn't happen, but don't crash if it somehow does
    let startId = null;
    try { startId = parseInt(localStorage.getItem('microdfir_last_dashboard'), 10); } catch (e) {}
    if (!startId || !allDashboards.some(d => d.id === startId)) {
        startId = (allDashboards.find(d => d.name === 'Overview') || allDashboards[0]).id;
    }
    currentDashboardId = startId;
    populateDashboardSelect();
    await switchDashboard(startId);
}

let newDashboardModal = null, renameDashboardModal = null, addWidgetModalInstance = null;

function showNewDashboardModal() {
    document.getElementById('newDashboardName').value = '';
    document.getElementById('newDashboardError').style.display = 'none';
    if (!newDashboardModal) newDashboardModal = new bootstrap.Modal(document.getElementById('newDashboardModal'));
    newDashboardModal.show();
}

function createDashboard() {
    const name = document.getElementById('newDashboardName').value.trim();
    const errBox = document.getElementById('newDashboardError');
    if (!name) { errBox.innerText = 'Name is required.'; errBox.style.display = 'block'; return; }
    fetch('/api/dashboards', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ name }) })
        .then(r => r.json().then(data => ({ ok: r.ok, data })))
        .then(async ({ ok, data }) => {
            if (!ok) { errBox.innerText = data.error || 'Failed to create dashboard.'; errBox.style.display = 'block'; return; }
            newDashboardModal.hide();
            await loadDashboardsPreservingSelection(data.id);
        })
        .catch(err => { errBox.innerText = 'Error: ' + err; errBox.style.display = 'block'; });
}

function showRenameDashboardModal() {
    const dash = allDashboards.find(d => d.id === currentDashboardId);
    if (!dash) return;
    document.getElementById('renameDashboardName').value = dash.name;
    document.getElementById('renameDashboardError').style.display = 'none';
    if (!renameDashboardModal) renameDashboardModal = new bootstrap.Modal(document.getElementById('renameDashboardModal'));
    renameDashboardModal.show();
}

function renameDashboard() {
    const name = document.getElementById('renameDashboardName').value.trim();
    const errBox = document.getElementById('renameDashboardError');
    if (!name) { errBox.innerText = 'Name is required.'; errBox.style.display = 'block'; return; }
    fetch(`/api/dashboards/${currentDashboardId}`, { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ name }) })
        .then(r => r.json().then(data => ({ ok: r.ok, data })))
        .then(async ({ ok, data }) => {
            if (!ok) { errBox.innerText = data.error || 'Failed to rename dashboard.'; errBox.style.display = 'block'; return; }
            renameDashboardModal.hide();
            await loadDashboardsPreservingSelection(currentDashboardId);
        })
        .catch(err => { errBox.innerText = 'Error: ' + err; errBox.style.display = 'block'; });
}

async function deleteCurrentDashboard() {
    const dash = allDashboards.find(d => d.id === currentDashboardId);
    if (!dash) return;
    if (!(await confirmDialog(`Delete the "${dash.name}" dashboard and all its widgets? This can't be undone.`, { title: 'Delete dashboard', danger: true, confirmLabel: 'Delete' }))) return;
    fetch(`/api/dashboards/${currentDashboardId}`, { method: 'DELETE' })
        .then(r => r.json().then(data => ({ ok: r.ok, data })))
        .then(async ({ ok, data }) => {
            if (!ok) { toast(data.error || 'Failed to delete dashboard.', 'danger'); return; }
            try { localStorage.removeItem('microdfir_last_dashboard'); } catch (e) {}
            await loadDashboards();
        })
        .catch(err => toast('Error deleting dashboard: ' + err, 'danger'));
}

// Refreshes the dashboard list (e.g. after create/rename) while staying on a specific
// dashboard id, instead of loadDashboards()'s own "pick a sensible starting point"
// logic which would otherwise re-select the last-viewed one from localStorage.
async function loadDashboardsPreservingSelection(did) {
    allDashboards = await fetch('/api/dashboards').then(r => r.json());
    currentDashboardId = did;
    try { localStorage.setItem('microdfir_last_dashboard', did); } catch (e) {}
    populateDashboardSelect();
    await switchDashboard(did);
}

function showAddWidgetModal() {
    renderWidgetPicker();
    if (!addWidgetModalInstance) addWidgetModalInstance = new bootstrap.Modal(document.getElementById('addWidgetModal'));
    addWidgetModalInstance.show();
}

function widgetPickerSection(title, entries) {
    if (!entries.length) return '';
    return `
        <h6 class="text-muted small text-uppercase mb-2">${escHtml(title)}</h6>
        <div class="row g-2 mb-3">
            ${entries.map(([type, def]) => `
                <div class="col-6 col-md-4">
                    <button type="button" class="btn btn-outline-secondary w-100 text-start" onclick="addWidget('${type}')">
                        <i class="fa-solid ${def.icon} me-2"></i>${escHtml(def.label)}
                    </button>
                </div>`).join('')}
        </div>`;
}

function renderWidgetPicker() {
    const entries = Object.entries(WIDGET_REGISTRY);
    const charts = entries.filter(([, def]) => def.category === 'chart');
    const apps = entries.filter(([, def]) => def.category === 'app');
    document.getElementById('addWidgetBody').innerHTML =
        widgetPickerSection('Charts & Analytics', charts) + widgetPickerSection('Live App Views', apps);
}

function addWidget(widgetType) {
    const def = WIDGET_REGISTRY[widgetType];
    if (!def) return;
    // Land the new widget below everything currently on the grid, full-width start
    // column, so it never overlaps an existing one.
    const y = grid.getGridItems().reduce((max, item) => {
        const n = item.gridstackNode;
        return n ? Math.max(max, n.y + n.h) : max;
    }, 0);
    fetch(`/api/dashboards/${currentDashboardId}/widgets`, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ widget_type: widgetType, x: 0, y, w: def.defaultW, h: def.defaultH }),
    }).then(r => r.json()).then(data => {
        addWidgetToGrid({ id: data.id, widget_type: widgetType, x: 0, y, w: def.defaultW, h: def.defaultH, config: {} });
        if (addWidgetModalInstance) addWidgetModalInstance.hide();
    }).catch(err => toast('Error adding widget: ' + err, 'danger'));
}

document.addEventListener('DOMContentLoaded', () => {
    initGrid();
    loadDashboards();
});
</script>
{% endblock %}
