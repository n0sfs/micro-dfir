# Micro DFIR -- opt-in DNS query logging (config/microsoc-dnsmasq.service).
#
# This process ONLY resolves/logs DNS for devices an admin has manually pointed at this
# appliance's IP as their DNS server -- it is never advertised via DHCP and never becomes
# this network's default resolver. It is intentionally NOT started/stopped/restarted by
# update.sh, so a normal app deploy can never interrupt DNS resolution for whatever
# devices have opted in. See config/microsoc-dnsmasq.service for the systemd unit and
# the one-time manual install steps (this appliance cannot install new packages or
# systemd units on itself as part of a normal deploy).

# Only listen on this appliance's own LAN address, never 0.0.0.0 -- this can only ever
# answer a device that was deliberately pointed here, not the whole broadcast domain.
listen-address=192.168.86.100
bind-interfaces

# Pure DNS forwarder + logger. DHCP is deliberately never configured here (no
# dhcp-range) -- this must never compete with the network's actual router for that role.
port=53
no-resolv
server=1.1.1.1
server=1.0.0.1

# log-queries=extra prefixes each query line with the requesting device's IP -- the
# single field this whole feature exists to capture (which device asked, not just what
# was asked). See src/app.py's generate_vector_config() for the Vector-side parser that
# tails this file (a regex on "query[TYPE] domain from IP", format-agnostic to whichever
# log-queries mode is set), and templates/dashboard.html's Log Pipeline tab for the
# read-only status/parser view.
log-queries=extra
log-facility=/var/log/microsoc-dnsmasq/query.log

# Small, fixed cache -- this is a logging tap for a handful of opted-in home devices,
# not a resolver being tuned for performance.
cache-size=150
