# One-time install seed only -- install.sh copies this file to /etc/vector/vector.toml
# once, but src/app.py's generate_vector_config() fully regenerates that live file from
# current settings/drop_rules (including the opt-in DNS query logging source/transform)
# on every app startup, so this file's exact content stops mattering after first boot.
# Not hand-maintained to mirror generate_vector_config() line-for-line -- see that
# function for the actual current pipeline shape.
[sources.windows_agent_https]
type = "http_server"
address = "0.0.0.0:5000"
path = "/api/ingest"
encoding = "json"

[sources.windows_agent_https.tls]
enabled = true
crt_file = "/opt/micro-dfir/config/cert.pem"
key_file = "/opt/micro-dfir/config/key.pem"

[transforms.shape_logs]
type = "remap"
inputs = ["windows_agent_https"]
source = '''
  .received_at = to_string!(now())
'''

[sinks.microsoc_local_ingest]
type = "http"
inputs = ["shape_logs"]
uri = "https://127.0.0.1:5001/api/ingest"
encoding.codec = "json"
compression = "gzip"
tls.enabled = true
tls.verify_certificate = false

[sinks.microsoc_local_ingest.batch]
max_events = 100
timeout_secs = 2.0
