<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Micro DFIR Dashboard</title>
    <!-- Bootstrap 5 & FontAwesome -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { display: flex; height: 100vh; overflow: hidden; background-color: #f8f9fa; }
        .sidebar { width: 250px; background: #212529; color: #fff; display: flex; flex-direction: column; }
        .sidebar a { color: #adb5bd; text-decoration: none; padding: 15px 20px; display: block; border-left: 3px solid transparent; }
        .sidebar a:hover { color: #fff; background: #343a40; border-left-color: #0d6efd; }
        .sidebar i { width: 25px; }
        .content { flex-grow: 1; padding: 20px; overflow-y: auto; }
    </style>
</head>
<body>
    <!-- Persistent Sidebar Navigation -->
    <div class="sidebar shadow">
        <h4 class="p-3 text-center border-bottom border-secondary">
            <i class="fas fa-shield-alt text-primary"></i> Micro-SOC
        </h4>
        <ul class="nav flex-column mt-2">
            <li class="nav-item">
                <a href="/" class="nav-link"><i class="fas fa-chart-line"></i> Dashboard</a>
            </li>
            <li class="nav-item">
                <a href="{{ url_for('settings') }}" class="nav-link"><i class="fas fa-cogs"></i> Agents & Settings</a>
            </li>
            <li class="nav-item mt-4">
                <a href="https://{{ request.host.split(':')[0] }}:8889" target="_blank" class="nav-link">
                    <i class="fas fa-crosshairs text-danger"></i> Velociraptor EDR
                </a>
            </li>
        </ul>
    </div>
    
    <!-- Dynamic Page Content -->
    <div class="content">
        {% block content %}{% endblock %}
    </div>
</body>
</html>
